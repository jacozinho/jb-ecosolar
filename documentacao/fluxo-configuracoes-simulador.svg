<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title description">
  <title id="title">Fluxo das configuracoes do simulador solar</title>
  <desc id="description">Ilustracao do caminho entre o painel administrativo, a API e a simulacao do cliente.</desc>
  <defs>
    <style>
      .background { fill: #f5f7fb; }
      .title { fill: #132238; font: 700 32px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #5b6b82; font: 400 18px Arial, Helvetica, sans-serif; }
      .box-title { fill: #132238; font: 700 21px Arial, Helvetica, sans-serif; }
      .box-copy { fill: #5b6b82; font: 400 16px Arial, Helvetica, sans-serif; }
      .formula { fill: #163d7a; font: 700 15px Arial, Helvetica, sans-serif; }
      .box { fill: #ffffff; stroke: #dfe7f4; stroke-width: 2; }
      .admin { fill: #dfeaff; stroke: #163d7a; stroke-width: 2; }
      .api { fill: #e7f7ef; stroke: #0f9d68; stroke-width: 2; }
      .result { fill: #fff6dc; stroke: #f4b942; stroke-width: 2; }
      .arrow { fill: none; stroke: #5b6b82; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6b82" />
    </marker>
  </defs>

  <rect class="background" width="1400" height="740" />
  <text class="title" x="70" y="70">Como as configuracoes definem a simulacao do cliente</text>
  <text class="subtitle" x="70" y="105">O administrador ajusta os parametros e a API os aplica a cada nova simulacao.</text>

  <rect class="admin" x="70" y="175" width="310" height="280" rx="8" />
  <text class="box-title" x="100" y="220">Painel administrativo</text>
  <text class="box-copy" x="100" y="255">O administrador configura:</text>
  <text class="box-copy" x="115" y="290">- Tarifa de energia</text>
  <text class="box-copy" x="115" y="320">- Producao media por kWp</text>
  <text class="box-copy" x="115" y="350">- Fator de perdas</text>
  <text class="box-copy" x="115" y="380">- Percentual de economia</text>
  <text class="box-copy" x="115" y="410">- Vida util do sistema</text>

  <path class="arrow" d="M380 315 L500 315" />
  <rect class="api" x="500" y="235" width="300" height="160" rx="8" />
  <text class="box-title" x="530" y="280">API e banco de dados</text>
  <text class="box-copy" x="530" y="315">Armazena os parametros</text>
  <text class="box-copy" x="530" y="345">e calcula os resultados</text>

  <path class="arrow" d="M800 315 L920 315" />
  <rect class="box" x="920" y="175" width="410" height="280" rx="8" />
  <text class="box-title" x="950" y="220">Simulador do cliente</text>
  <text class="box-copy" x="950" y="255">Cliente informa a conta mensal</text>
  <rect x="950" y="275" width="350" height="54" rx="6" fill="#eef4ff" />
  <text class="formula" x="975" y="309">Exemplo: conta mensal = R$ 520,00</text>
  <text class="box-copy" x="950" y="365">A API usa os parametros configurados</text>
  <text class="box-copy" x="950" y="395">para gerar a estimativa personalizada.</text>

  <path class="arrow" d="M1125 455 L1125 540" />
  <rect class="result" x="620" y="540" width="710" height="145" rx="8" />
  <text class="box-title" x="650" y="585">Resultados mostrados ao cliente</text>
  <text class="formula" x="650" y="625">Consumo estimado = conta / tarifa</text>
  <text class="formula" x="650" y="653">Potencia, economia mensal, anual e acumulada usam os parametros administrativos.</text>
</svg>
